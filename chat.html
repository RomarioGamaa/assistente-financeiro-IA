<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Assistente Financeiro IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0c1317; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 480px; height: 90vh; background-color: #111b21; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #222e35; }
    .chat-header { background-color: #202c33; padding: 14px 18px; display: flex; align-items: center; gap: 12px; color: #e9edef; font-weight: 600; border-bottom: 1px solid #2a3942; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #00a884; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 16px 16px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background-color: #005c4b; color: #e9edef; border-top-right-radius: 2px; }
    .bot { align-self: flex-start; background-color: #202c33; color: #e9edef; border-top-left-radius: 2px; }
    .chat-input-bar { background-color: #202c33; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
    .chat-input { flex: 1; background-color: #2a3942; border: none; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 0.95rem; outline: none; }
    .chat-input::placeholder { color: #8696a0; }
    .btn-send { background-color: #00a884; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #111b21; font-weight: bold; font-size: 1.1rem; }
    .btn-send:hover { background-color: #06cf9c; }
  </style>
</head>
<body>
    <div class="chat-container">
      
      <!-- Cabeçalho -->
      <div class="chat-header">
        <div class="chat-avatar">🤖</div>
        <div>
          <div>Assistente Financeiro</div>
          <div style="font-size: 11px; color: #10a37f; font-weight: normal;">online</div>
        </div>
  
        <!-- Botões de Exportação -->
        <div style="margin-left: auto; display: flex; gap: 8px;">
          <a href="/exportar/csv" download style="color: #10a37f; text-decoration: none; font-size: 12px; border: 1px solid #10a37f; padding: 4px 8px; border-radius: 6px;">📥 CSV</a>
          <a href="/exportar/xlsx" download style="color: #10a37f; text-decoration: none; font-size: 12px; border: 1px solid #10a37f; padding: 4px 8px; border-radius: 6px;">📊 Excel</a>
        </div>
      </div>
  
      <!-- Área de Mensagens -->
      <div class="chat-messages" id="chat">
        <div class="bubble bot">Olá! Pode enviar seus lançamentos (ex: <i>"Recebi 40 no pix"</i> ou <i>"Quanto fechei hoje?"</i>).</div>
      </div>
  
      <!-- Barra de Input -->
      <form class="chat-input-bar" id="form">
        <input type="text" id="mensagem" class="chat-input" placeholder="Mensagem..." autocomplete="off" required />
        <button type="submit" class="btn-send">➤</button>
      </form>
  
    </div> <!-- Fecha chat-container apenas aqui no final -->
  
    <script>
      const form = document.getElementById('form');
      const input = document.getElementById('mensagem');
      const chat = document.getElementById('chat');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const texto = input.value.trim();
        if (!texto) return;

        // Mensagem do usuário
        const userBubble = document.createElement('div');
        userBubble.className = 'bubble user';
        userBubble.textContent = texto;
        chat.appendChild(userBubble);
        input.value = '';
        chat.scrollTop = chat.scrollHeight;

        try {
          const res = await fetch('/webhook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensagem: texto, telefone: "web-demo" })
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`HTTP ${res.status}: ${errText}`);
          }

          const data = await res.json();
          console.log("Retorno do backend:", data);

          // Extrai o conteúdo independentemente da chave de resposta retornada
          const respostaBackend = data.mensagem_resposta ?? data.resposta ?? data.mensagem ?? data.reply ?? JSON.stringify(data);

          // Renderiza a resposta do assistente
          const botBubble = document.createElement('div');
          botBubble.className = 'bubble bot';
          botBubble.innerHTML = String(respostaBackend).replace(/\n/g, '<br>');
          chat.appendChild(botBubble);

        } catch (err) {
          console.error("Falha na comunicação:", err);
          const errorBubble = document.createElement('div');
          errorBubble.className = 'bubble bot';
          errorBubble.textContent = 'Erro ao se comunicar: ' + err.message;
          chat.appendChild(errorBubble);
        }

        chat.scrollTop = chat.scrollHeight;
      });
    </script>
  </body>
  </html>
