<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Assistente Financeiro IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0c1317; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 480px; height: 90vh; background-color: #111b21; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #222e35; }
    .chat-header { background-color: #202c33; padding: 14px 18px; display: flex; align-items: center; gap: 12px; color: #e9edef; font-weight: 600; border-bottom: 1px solid #2a3942; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #00a884; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 16px 16px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background-color: #005c4b; color: #e9edef; border-top-right-radius: 2px; }
    .bot { align-self: flex-start; background-color: #202c33; color: #e9edef; border-top-left-radius: 2px; }
    .chat-input-bar { background-color: #202c33; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
    .chat-input { flex: 1; background-color: #2a3942; border: none; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 0.95rem; outline: none; }
    .chat-input::placeholder { color: #8696a0; }
    .btn-send { background-color: #00a884; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #111b21; font-weight: bold; font-size: 1.1rem; }
    .btn-send:hover { background-color: #06cf9c; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-avatar">🤖</div>
      <div>
        <div>Assistente Financeiro</div>
        <small style="color: #00a884; font-size: 0.75rem;">online</small>
      </div>
    </div>
    
    <div class="chat-messages" id="chat">
      <div class="bubble bot">Olá! Pode enviar seus lançamentos (ex: <i>"Recebi 40 no pix"</i> ou <i>"Quanto fechei hoje?"</i>).</div>
    </div>

    <form class="chat-input-bar" id="form">
      <input type="text" id="mensagem" class="chat-input" placeholder="Mensagem..." autocomplete="off" required />
      <button type="submit" class="btn-send">➤</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("mensagem");
    const chat = document.getElementById("chat");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const texto = input.value.trim();
      if (!texto) return;

      chat.innerHTML += `<div class="bubble user">${texto}</div>`;
      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("/webhook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ telefone: "5562999999999", mensagem: texto })
        });
        const data = await res.json();
        chat.innerHTML += `<div class="bubble bot">${data.mensagem_resposta}</div>`;
      } catch (err) {
        chat.innerHTML += `<div class="bubble bot">❌ Erro de comunicação com o servidor.</div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    });
  </script>
</body>
</html>
